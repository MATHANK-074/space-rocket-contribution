name: Generate Space Rocket SVG

on:
  # Runs daily at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Manual trigger
  workflow_dispatch:
  # Also run on push to main (for first setup)
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # needed to push generated SVGs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate SVGs
        env:
          GITHUB_USER: MATHANK-074
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/generate.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update space rocket contribution SVG"
          git push
